        try { Object.defineProperty(screen, 'height', { configurable: true, get: function () { return 1080; } }); } catch (e) {}

    <script>
      (function() {
        var canvas = null;

        function scaleCanvas() {
          if (!canvas) return;
          var cw = canvas.width || 1920, ch = canvas.height || 1080;   // the canvas's real pixel size
          var vp = window.__realViewport();
          if (!vp.w || !vp.h) return;
          // The game is told the window is always 16:9 (see __realViewport), so it draws undistorted.
          // Fit that picture inside the real screen, keeping its proportions.
          var scale = Math.min(vp.w / cw, vp.h / ch);
          var w = Math.max(1, Math.round(cw * scale)), h = Math.max(1, Math.round(ch * scale));
          if (canvas.style.width !== w + "px")   canvas.style.width  = w + "px";
          if (canvas.style.height !== h + "px")  canvas.style.height = h + "px";
          canvas.style.transform = "translate(-50%, -50%)";
        }

        window.addEventListener("resize", scaleCanvas);
        window.addEventListener("orientationchange", function() {
          setTimeout(scaleCanvas, 100); // brief delay for orientation to settle
          setTimeout(scaleCanvas, 400);
        });

        function waitForCanvas() {
          var c = document.querySelector("canvas");
          if (!c) { setTimeout(waitForCanvas, 50); return; }
          canvas = c;

          var container = document.querySelector(".game-container");
          if (canvas.parentElement !== container) container.appendChild(canvas);

          // MutationObserver: re-apply scale if game overwrites canvas style/attributes
          var observer = new MutationObserver(scaleCanvas);
          observer.observe(canvas, { attributes: true, attributeFilter: ["style", "width", "height"] });

          scaleCanvas();

          if (typeof window.onGameSetWindowSize === "function") {
            window.onGameSetWindowSize(canvas.width, canvas.height);
          }
        }

        waitForCanvas();

        var domObserver = new MutationObserver(function() {
          if (document.querySelector("canvas")) {
            waitForCanvas();
            domObserver.disconnect();
          }
        });
        domObserver.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
